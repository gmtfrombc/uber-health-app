name: quickcarept
description: "A telehealth platform for physical therapy and healthcare services."
publish_to: 'none' # Remove this line if you wish to 
version: 1.0.0+14  # version 1.0.0, build number 12

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  lottie: ^3.3.1
  http: ^1.2.1
  audio_session: ^0.1.18
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  cloud_functions: ^5.0.0
  flutter_webrtc: ^0.12.11
  connectivity_plus: ^6.1.3
  intl: ^0.20.2
  agora_rtc_engine: ^6.5.1
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0
  shared_preferences: ^2.2.2
  voice_chat_core:
    git:
      url: https://github.com/gmtfrombc/voice_chat_core.git
      ref: main
  flutter_dotenv: ^5.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  just_audio: ^0.9.36
  path_provider: ^2.1.3
  dart_openai: ^5.1.0
  flutter_markdown: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env.local
    - assets/animations/
    - assets/images/welcome.png
    - assets/images/xuber_health.png
    - assets/images/medical_services.png
    - assets/images/physical_therapy.png
    - assets/images/cough_cold.png
    - assets/images/uti.png
    - assets/images/allergies.png
    - assets/images/gi.png
    - assets/images/skin.png
    - assets/images/msk.png
    - assets/images/general.png
    - assets/images/other.png
    - assets/images/neck.png
    - assets/images/back.png
    - assets/images/shoulder.png
    - assets/images/elbow.png
    - assets/images/wrist.png
    - assets/images/hip.png
    - assets/images/knee.png
    - assets/images/foot.png
    - assets/images/dietician.png
    - assets/images/pharmacist.png
    - assets/images/naturopath.png
    - assets/images/elder_care.png
    - assets/images/hospice_care.png
    - assets/images/behavioral_health.png

flutter_native_splash:
  color: "#1565C0"
  android: true
  ios: true
  web: true
